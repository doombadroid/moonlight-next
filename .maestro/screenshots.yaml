# App Store screenshots on an iPhone simulator, in demo mode (-MNDemoMode YES): one made-up
# PC with MoonLume's own box art, and a still in place of the stream (no network).
# Run by .github/workflows/sim-screenshots.yml, which turns *-land shots to landscape.
appId: com.doombadroid.moonlume
---
- launchApp:
    clearState: true
    arguments:
      MNDemoMode: "YES"
      # Settings opens with the Gyro header at the top (demo mode only)
      MNDemoSettingsAnchor: gyro-header
# A cold launch can take a while on the CI simulator.
- extendedWaitUntil:
    visible: "Gaming PC"
    timeout: 60000
# The PC's page: pushed already when the single PC is selected, else open it.
- runFlow:
    when:
      notVisible: "NOW RUNNING"
    commands:
      - tapOn: "Gaming PC"
- extendedWaitUntil:
    visible: "NOW RUNNING"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-launcher

# The stream is landscape-only. The device is turned too: with the device left in portrait,
# XCTest drops every element right of the portrait width and taps land in portrait points.
- tapOn: "Resume"
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Stream menu"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 02-stream-land

- tapOn: "Stream menu"
- waitForAnimationToEnd:
    timeout: 3000
# First keyboard use in a fresh simulator shows the swipe-typing intro (the workflow
# also marks it seen)
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "Edit Controls"
    timeout: 10000
- takeScreenshot: 03-stream-menu-land

# Edit Controls, then the widget picker
- tapOn: "Edit Controls"
- extendedWaitUntil:
    visible: "Add widget"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 04-edit-controls-land
- tapOn: "Add widget"
- extendedWaitUntil:
    visible: "Gamepad buttons"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 04b-widget-picker-land
- tapOn: "Cancel"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Cancel"
- tapOn:
    text: "Discard Changes"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000

# The keyboard & trackpad input deck
- tapOn: "Stream menu"
- tapOn: "Keyboard & Trackpad"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-input-deck-land

# Back to the launcher (Disconnect is further down the menu), then Settings in portrait
- tapOn: "Stream menu"
- runFlow:
    when:
      notVisible: "Disconnect"
    commands:
      - swipe:
          from:
            text: "Turn Touch Off"
          direction: UP
- tapOn: "Disconnect"
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "NOW RUNNING"
    timeout: 15000
- tapOn:
    text: "Back|Computers"
    optional: true
- runFlow:
    when:
      notVisible: "Settings"
    commands:
      - tapOn:
          point: "9%,10%"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Done"
    timeout: 10000
- tapOn:
    text: "Continue"
    optional: true
- extendedWaitUntil:
    visible: "GYRO"
    timeout: 10000
# Gyro aiming on (Mouse) shows the rest of its settings
- tapOn:
    text: "Mouse"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 06-settings-gyro
